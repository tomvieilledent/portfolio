# =====================================================================
#  SOURCE DE VÉRITÉ des projets publiés sous vlldnt.fr.
#  Éditée à la main. Un `push` sur main lance le workflow "sync" :
#   - en DRY-RUN (affiche le plan dans le résumé du job)
#   - puis exécuter manuellement "Sync projects" (dry_run: false) pour appliquer.
#
#  RÈGLES
#   - deployed: true   → app sur <name>.vlldnt.fr (+ landing sur vlldnt.fr/<name>
#                         si le dépôt contient un dossier landing-page/)
#   - deployed: false  → ABSENT du VPS (aucun dossier, vhost, conteneur)
#   - entrée SUPPRIMÉE → le projet est retiré du VPS (backup + confirmation ;
#                         les données data/<name> sont archivées, pas détruites)
#   - `name` : ^[a-z][a-z0-9-]{1,38}$  — sert aux URLs, chemins et conteneurs
#   - public: false     → déployé (vhost + conteneur sur <name>.vlldnt.fr) mais absent
#                         de la page d'accueil (ex. l'API backend d'un autre projet).
#                         Par défaut (absent) : public.
# =====================================================================

domain: vlldnt.fr

# Portfolio dockerisé (runtime compose, cf. compose.yml). Port loopback interne.
portfolio:
  port: 8086

projects:
  - name: flashcard
    title: Flashcard
    tagline: Application de révision — toutes les notions du cursus fullstack, regroupées par domaine, avec exemples de code et recherche plein texte.
    stack: React · Vite
    role: Projet personnel — conception, développement, hébergement
    logo: /logos/flashcard.svg
    repo: https://github.com/tomvieilledent/flashcard.git
    branch: main
    deployed: true
    runtime: compose            # static | compose
    port: 8084                  # port loopback interne

  - name: tilleul-canac
    title: Le Tilleul de Canac
    tagline: Site vitrine d'une chambre d'hôtes en Aveyron — présentation, galerie et disponibilités.
    stack: React · Vite · Leaflet
    role: Projet client — conception et développement
    logo: /logos/tilleul-canac.svg
    wip: true                    # en construction : pas de lien public vers l'app
    source: false                # pas de lien « Code source » (projet client)
    repo: https://github.com/tomvieilledent/tilleul-canac.git
    branch: main
    deployed: true
    runtime: compose
    port: 8085                  # port loopback interne (compose_file: compose.yml par défaut,
                                 # à la racine du dépôt — le backend a le sien sous backend/)

  - name: vakom-stephen
    title: Site vitrine Vakom
    tagline: Site vitrine d'un consultant local du réseau Vakom — expertises, solutions RH, présentation et contact.
    stack: React · Vite · Tailwind
    role: Projet client — conception et développement
    logo: /logos/vakom-stephen.svg
    wip: true                    # en construction
    repo: https://github.com/tomvieilledent/vakom_stephen.git
    branch: main
    deployed: true
    runtime: landing             # landing-page/ uniquement : aucune app, pas de sous-domaine

  - name: mde
    title: Portail MDE
    tagline: Portail interne de la Maison de l'Économie — annuaire des entreprises, messagerie, agenda, formations et actualités. Démo avec jeu de données fictif.
    stack: React · FastAPI · PostgreSQL
    role: Projet — conception, développement, hébergement
    logo: /logos/mde.svg
    repo: https://github.com/tomvieilledent/portailMDE.git
    branch: main
    deployed: true
    runtime: compose
    port: 8088                  # port loopback interne
    compose_file: compose.vlldnt.yml
    # CSP élargie : polices locales, aperçus d'images (blob:) et WebSocket de la messagerie.
    csp: "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' wss://mde.vlldnt.fr; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    # secrets réels : /opt/vlldnt/config/mde.env (hors Git, cf. .env.vlldnt.example du dépôt)

  - name: tilleul-canac-api
    public: false               # API de réservation du Tilleul de Canac — pas de vitrine
    repo: https://github.com/tomvieilledent/tilleul-canac.git
    branch: main
    deployed: true
    runtime: compose
    port: 8083
    compose_file: backend/compose.yml
    # secrets réels : /opt/vlldnt/config/tilleul-canac-api.env (hors Git, chmod 600 ;
    # cf. backend/.env.example du dépôt pour la liste des variables)
