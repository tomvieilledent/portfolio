# /opt/vlldnt/nginx/snippets/security-headers.conf
# En-têtes de sécurité COMMUNS à tout *.vlldnt.fr (SSOT : repo portfolio).
# À `include` dans CHAQUE bloc `location` qui déclare un `add_header` : nginx
# cesse d'hériter des `add_header` parents dès qu'un `location` en ajoute un.
#
# La Content-Security-Policy n'est PAS ici : elle est propre à chaque site
# (portfolio, flashcard…) et injectée par les templates de vhost / le vhost apex.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
