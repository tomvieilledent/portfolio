# Config nginx interne au conteneur du portfolio (dist/ Astro). Les en-têtes
# de sécurité/CSP restent posés par le vhost apex du VPS (vlldnt.conf.base),
# qui proxy_pass vers ce conteneur — rien à dupliquer ici.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* ^/(assets|_astro)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
