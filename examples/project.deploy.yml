# À COPIER dans chaque dépôt de projet : .github/workflows/deploy.yml
# Remplace <NOM> par le `name` du projet dans portfolio/projects.yml
# (ex: flashcard). Le script côté VPS vérifie lui-même `deployed: true` :
# un push sur un projet marqué `n` ne déploie donc rien.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vlldnt-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → deploy-project.sh <NOM>
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id ; chmod 600 ~/.ssh/id
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id -p "$SSH_PORT" -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" 'bash /opt/vlldnt/scripts/deploy-project.sh <NOM>'
