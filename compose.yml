# Conteneur du portfolio (vlldnt.fr). Le vhost apex (deploy/nginx/vlldnt.conf.base)
# proxy_pass vers ce conteneur ; déployé par deploy-portfolio.sh (docker compose).
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8086}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
